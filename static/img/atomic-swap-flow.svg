<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="1200" height="680" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest">
  <title id="t">Atomic swap between two counterparties on XRPL</title>
  <desc id="d">Two counterparties, each holding an asset at their own custodian, agree terms with an orchestrator. The orchestrator builds one batch transaction containing both legs, each counterparty signs from its own custodian, and the XRP Ledger swaps both legs atomically: both settle at once, or neither does.</desc>
  <defs>
    <style>
      .t{font-family:Booton,Inter,"Helvetica Neue",Arial,sans-serif;fill:#FFFFFF}
      .h{font-size:22px;font-weight:600}
      .s{font-size:14px;fill:#CAD4DF}
      .lab{font-size:14px;font-weight:600;fill:#FFFFFF}
      .chip{font-size:13px;font-weight:500;fill:#FFFFFF}
      .num{font-size:12px;font-weight:700;fill:#141414}
    </style>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1L9 5L1 9z" fill="#8A919A"/>
    </marker>
    <marker id="aA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M1 1L9 5L1 9z" fill="#428CFF"/>
    </marker>
    <marker id="aB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M1 1L9 5L1 9z" fill="#C0A7FF"/>
    </marker>
  </defs>

  <rect width="1200" height="680" rx="20" fill="#141414"/>

  <!-- Top row -->
  <rect x="60" y="40" width="280" height="130" rx="14" fill="#232325" stroke="#343437"/>
  <text class="t h" x="200" y="80" text-anchor="middle">Counterparty A</text>
  <text class="t s" x="200" y="104" text-anchor="middle">Delivers Asset A</text>
  <rect x="125" y="122" width="150" height="32" rx="16" fill="#141414" stroke="#428CFF"/>
  <text class="t chip" x="200" y="143" text-anchor="middle">Custodian A</text>

  <rect x="460" y="40" width="280" height="130" rx="14" fill="#232325" stroke="#343437"/>
  <text class="t h" x="600" y="80" text-anchor="middle">Orchestrator</text>
  <text class="t s" x="600" y="104" text-anchor="middle">Coordinates the trade</text>
  <text class="t s" x="600" y="124" text-anchor="middle">and never holds the assets</text>
  <text class="t s" x="600" y="148" text-anchor="middle" style="fill:#8A919A">e.g. a trading venue or marketplace</text>

  <rect x="860" y="40" width="280" height="130" rx="14" fill="#232325" stroke="#343437"/>
  <text class="t h" x="1000" y="80" text-anchor="middle">Counterparty B</text>
  <text class="t s" x="1000" y="104" text-anchor="middle">Delivers Asset B</text>
  <rect x="925" y="122" width="150" height="32" rx="16" fill="#141414" stroke="#C0A7FF"/>
  <text class="t chip" x="1000" y="143" text-anchor="middle">Custodian B</text>

  <!-- 1 Agree terms -->
  <path d="M346 105H454" stroke="#8A919A" stroke-width="2" stroke-dasharray="5 5" fill="none" marker-start="url(#a)" marker-end="url(#a)"/>
  <path d="M746 105H854" stroke="#8A919A" stroke-width="2" stroke-dasharray="5 5" fill="none" marker-start="url(#a)" marker-end="url(#a)"/>
  <circle cx="352" cy="80" r="10" fill="#21E46B"/><text class="t num" x="352" y="84" text-anchor="middle">1</text>
  <text class="t lab" x="367" y="85" style="font-size:13px">Agree terms</text>
  <circle cx="752" cy="80" r="10" fill="#21E46B"/><text class="t num" x="752" y="84" text-anchor="middle">1</text>
  <text class="t lab" x="767" y="85" style="font-size:13px">Agree terms</text>

  <!-- 2 Build -->
  <path d="M600 172V246" stroke="#8A919A" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <circle cx="622" cy="210" r="10" fill="#21E46B"/><text class="t num" x="622" y="214" text-anchor="middle">2</text>
  <text class="t lab" x="638" y="215">Build one batch</text>

  <!-- 3 Sign -->
  <path d="M200 172V290H466" stroke="#8A919A" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M1000 172V290H734" stroke="#8A919A" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <circle cx="222" cy="222" r="10" fill="#21E46B"/><text class="t num" x="222" y="226" text-anchor="middle">3</text>
  <text class="t lab" x="238" y="227">Sign from own custodian</text>
  <circle cx="978" cy="222" r="10" fill="#21E46B"/><text class="t num" x="978" y="226" text-anchor="middle">3</text>
  <text class="t lab" x="962" y="227" text-anchor="end">Sign from own custodian</text>

  <!-- Batch -->
  <rect x="470" y="252" width="260" height="76" rx="12" fill="#232325" stroke="#21E46B" stroke-width="2"/>
  <text class="t h" x="600" y="284" text-anchor="middle" style="font-size:20px">Batch transaction</text>
  <text class="t s" x="600" y="308" text-anchor="middle" style="fill:#21E46B;font-weight:600">Swaps both legs atomically</text>

  <!-- 4 Submit -->
  <path d="M600 330V382" stroke="#8A919A" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <circle cx="622" cy="356" r="10" fill="#21E46B"/><text class="t num" x="622" y="360" text-anchor="middle">4</text>
  <text class="t lab" x="638" y="361">Submit</text>

  <!-- XRPL band -->
  <rect x="40" y="388" width="1120" height="214" rx="18" fill="#111111" stroke="#343437"/>
  <text class="t" x="68" y="420" style="font-size:15px;font-weight:600;fill:#21E46B">XRP Ledger</text>

  <rect x="80" y="440" width="190" height="104" rx="12" fill="#232325" stroke="#343437"/>
  <text class="t lab" x="175" y="482" text-anchor="middle">Counterparty A</text>
  <text class="t s" x="175" y="504" text-anchor="middle">account</text>
  <rect x="930" y="440" width="190" height="104" rx="12" fill="#232325" stroke="#343437"/>
  <text class="t lab" x="1025" y="482" text-anchor="middle">Counterparty B</text>
  <text class="t s" x="1025" y="504" text-anchor="middle">account</text>

  <path d="M272 462C600 462 600 522 924 522" stroke="#428CFF" stroke-width="3" fill="none" marker-end="url(#aA)"/>
  <path d="M928 462C600 462 600 522 276 522" stroke="#C0A7FF" stroke-width="3" fill="none" marker-end="url(#aB)"/>
  <rect x="320" y="447" width="92" height="30" rx="15" fill="#141414" stroke="#428CFF"/>
  <text class="t chip" x="366" y="467" text-anchor="middle">Asset A</text>
  <rect x="788" y="447" width="92" height="30" rx="15" fill="#141414" stroke="#C0A7FF"/>
  <text class="t chip" x="834" y="467" text-anchor="middle">Asset B</text>

  <circle cx="600" cy="492" r="22" fill="#141414" stroke="#21E46B" stroke-width="2"/>
  <path d="M603 478L591 495H600L597 507L609 489H600Z" fill="#21E46B"/>

  <circle cx="512" cy="572" r="10" fill="#21E46B"/><text class="t num" x="512" y="576" text-anchor="middle">5</text>
  <text class="t lab" x="528" y="577">Both legs settle at once, or neither does</text>

  <text class="t s" x="600" y="645" text-anchor="middle">The same flow works for any two assets: delivery versus payment, payment versus payment, delivery versus delivery, FX and OTC swaps.</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
