<svg viewBox="0 0 840 572" width="840" height="572" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,BlinkMacSystemFont,'Helvetica Neue',Helvetica,Arial,sans-serif">

  <!-- Oracle card, top center -->
  <defs>
    <clipPath id="oraclecardclip"><rect x="300" y="30" width="240" height="170" rx="8"/></clipPath>
  </defs>
  <rect x="300.5" y="30.5" width="239" height="169" rx="7.5" fill="#FFFFFF" stroke="#CAD4DF" stroke-width="1"/>
  <rect x="300" y="30" width="240" height="4" fill="#21E46B" clip-path="url(#oraclecardclip)"/>
  <text x="420" y="83" text-anchor="middle" font-size="24" font-weight="700" fill="#141414">Oracle</text>
  <text x="420" y="108" text-anchor="middle" font-size="13" fill="#454549">Neutral Third Party</text>

  <!-- badge: accent green becomes the fill in light mode, with dark text on top -->
  <rect x="354" y="122" width="132" height="51" rx="12" fill="#21E46B"/>
  <g transform="translate(380,134) scale(0.5833)">
    <circle cx="12" cy="12" r="9" fill="none" stroke="#141414" stroke-width="1.8"/>
    <path d="M8 12.5l2.5 2.5 5-5.5" fill="none" stroke="#141414" stroke-width="1.8"/>
  </g>
  <text x="400" y="144" text-anchor="start" font-size="12.5" font-weight="700" fill="#141414">Verifies</text>
  <text x="420" y="160" text-anchor="middle" font-size="12.5" font-weight="700" fill="#141414">Real-World Data</text>

  <!-- diagonal arrow 1: oracle -> escrow creator (solid) -->
  <line x1="350" y1="200" x2="175" y2="349" stroke="#72777E" stroke-width="1.4"/>
  <g transform="translate(175,349) rotate(139.6)">
    <path d="M-9,-5.5 L0,0 L-9,5.5" stroke="#72777E" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- diagonal arrow 2: oracle -> recipient (dashed, pending) -->
  <g opacity="0.85">
    <line x1="490" y1="200" x2="633" y2="349" stroke="#72777E" stroke-width="1.4" stroke-dasharray="6 5"/>
    <g transform="translate(633,349) rotate(46.3)">
      <path d="M-9,-5.5 L0,0 L-9,5.5" stroke="#72777E" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>

  <!-- label 1 -->
  <text x="139" y="262" text-anchor="middle" font-family="'SFMono-Regular','Consolas','Menlo',monospace" font-size="13" fill="#141414">1. Condition</text>
  <text x="139" y="282" text-anchor="middle" font-family="'SFMono-Regular','Consolas','Menlo',monospace" font-size="13" fill="#141414">(at setup)</text>

  <!-- label 2 -->
  <text x="695" y="262" text-anchor="middle" font-family="'SFMono-Regular','Consolas','Menlo',monospace" font-size="13" fill="#141414">2. Fulfillment</text>
  <text x="695" y="282" text-anchor="middle" font-family="'SFMono-Regular','Consolas','Menlo',monospace" font-size="13" fill="#141414">(after verification)</text>

  <!-- Escrow Creator -->
  <circle cx="134" cy="384" r="44" fill="#E6EAF0"/>
  <g transform="translate(118,368) scale(1.3333)">
    <circle cx="12" cy="8" r="4" fill="none" stroke="#141414" stroke-width="1.6"/>
    <path d="M4 20c0-4.4 3.6-7 8-7s8 2.6 8 7" fill="none" stroke="#141414" stroke-width="1.6"/>
  </g>
  <text x="134" y="450" text-anchor="middle" font-size="13" fill="#141414">Escrow Creator</text>

  <!-- Recipient -->
  <circle cx="666" cy="384" r="44" fill="#E6EAF0"/>
  <g transform="translate(650,368) scale(1.3333)">
    <circle cx="12" cy="8" r="4" fill="none" stroke="#141414" stroke-width="1.6"/>
    <path d="M4 20c0-4.4 3.6-7 8-7s8 2.6 8 7" fill="none" stroke="#141414" stroke-width="1.6"/>
  </g>
  <text x="666" y="450" text-anchor="middle" font-size="13" fill="#141414">Recipient</text>

  <!-- legend pill: emphasis by weight, since bright green text would not read here -->
  <rect x="264" y="505" width="312" height="43" rx="21.5" fill="#FFFFFF" stroke="#CAD4DF" stroke-width="1"/>
  <text x="420" y="531" text-anchor="middle" font-size="15" fill="#454549"><tspan font-weight="700" fill="#141414">Condition</tspan> = Lock &#160;&#183;&#160; <tspan font-weight="700" fill="#141414">Fulfillment</tspan> = Key</text>
</svg>
