<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 760 500" role="img" font-family='Inter, "Helvetica Neue", Helvetica, Arial, sans-serif' xmlns:c2pa="http://c2pa.org/manifest">
<title>Vault share distribution and redemption</title>
<desc>A depositor deposits 500 XRP and receives 500,000,000 shares, then redeems 100,000,000 shares and receives 100 XRP. The vault exchanges one drop for one share. Vault properties: asset XRP, not private, shares not transferable, exchange rate 1 drop per share.</desc>
<defs><marker id="sav-arrow-dep" orient="auto" markerWidth="5" markerHeight="5" refX="2" refY="2" overflow="visible"><path d="M0 0 L4 2 L0 4 Z" style="fill:#4C8DF6;stroke:none"/></marker><marker id="sav-arrow-vlt" orient="auto" markerWidth="5" markerHeight="5" refX="2" refY="2" overflow="visible"><path d="M0 0 L4 2 L0 4 Z" style="fill:#21E46B;stroke:none"/></marker></defs>
<rect x="48.5" y="232.5" width="663" height="211" rx="4" style="fill:#1E1E1E;stroke:#444444;stroke-width:1"/>
<rect x="48" y="232" width="664" height="3" rx="1" style="fill:#21E46B;stroke:none"/>
<rect x="48.5" y="40.5" width="663" height="47" rx="4" style="fill:#1E1E1E;stroke:#444444;stroke-width:1"/>
<rect x="48" y="40" width="664" height="3" rx="1" style="fill:#4C8DF6;stroke:none"/>
<text x="380" y="69" text-anchor="middle" font-size="14" font-weight="400" style="fill:#FFFFFF">Depositor</text>
<rect x="64.5" y="264.5" width="247" height="79" rx="4" style="fill:#262626;stroke:#21E46B;stroke-width:1"/>
<rect x="400.5" y="264.5" width="239" height="79" rx="4" style="fill:#262626;stroke:#21E46B;stroke-width:1"/>
<text x="188" y="291" text-anchor="middle" font-size="13" font-weight="400" style="fill:#FFFFFF">Exchange</text>
<text x="188" y="309" text-anchor="middle" font-size="13" font-weight="400" style="fill:#FFFFFF"><tspan font-weight="600" style="fill:#21E46B">500,000,000 drops</tspan></text>
<text x="113.0" y="327" text-anchor="start" font-size="13" font-weight="400" style="fill:#FFFFFF">for <tspan font-weight="600" style="fill:#21E46B">500,000,000 shares</tspan></text>
<text x="520" y="291" text-anchor="middle" font-size="13" font-weight="400" style="fill:#FFFFFF">Exchange</text>
<text x="520" y="309" text-anchor="middle" font-size="13" font-weight="400" style="fill:#FFFFFF"><tspan font-weight="600" style="fill:#21E46B">100,000,000 shares</tspan></text>
<text x="449.4" y="327" text-anchor="start" font-size="13" font-weight="400" style="fill:#FFFFFF">for <tspan font-weight="600" style="fill:#21E46B">100,000,000 drops</tspan></text>
<text x="696" y="252" text-anchor="end" font-size="11" font-weight="600" style="fill:#8A919A" letter-spacing="0.66">VAULT</text>
<line x1="64" y1="364" x2="696" y2="364" style="stroke:#444444;stroke-width:1"/>
<text x="64" y="390" text-anchor="start" font-size="11" font-weight="500" style="fill:#8A919A" letter-spacing="0.33">ASSET</text>
<text x="64" y="411" text-anchor="start" font-size="14" font-weight="600" style="fill:#21E46B">XRP</text>
<text x="222" y="390" text-anchor="start" font-size="11" font-weight="500" style="fill:#8A919A" letter-spacing="0.33">PRIVATE VAULT</text>
<text x="222" y="411" text-anchor="start" font-size="14" font-weight="600" style="fill:#21E46B">No</text>
<line x1="210" y1="376" x2="210" y2="416" style="stroke:#444444;stroke-width:1"/>
<text x="380" y="390" text-anchor="start" font-size="11" font-weight="500" style="fill:#8A919A" letter-spacing="0.33">TRANSFERABLE SHARES</text>
<text x="380" y="411" text-anchor="start" font-size="14" font-weight="600" style="fill:#21E46B">No</text>
<line x1="368" y1="376" x2="368" y2="416" style="stroke:#444444;stroke-width:1"/>
<text x="538" y="390" text-anchor="start" font-size="11" font-weight="500" style="fill:#8A919A" letter-spacing="0.33">EXCHANGE RATE</text>
<text x="538" y="411" text-anchor="start" font-size="14" font-weight="600" style="fill:#21E46B">1 drop/share</text>
<line x1="526" y1="376" x2="526" y2="416" style="stroke:#444444;stroke-width:1"/>
<line x1="124" y1="88" x2="124" y2="259" marker-end="url(#sav-arrow-dep)" role="img" aria-label="From Depositor to the Vault, depositing 500 XRP" style="stroke:#4C8DF6;stroke-width:1.75;stroke-linecap:round"/>
<line x1="288" y1="264" x2="288" y2="93" marker-end="url(#sav-arrow-vlt)" role="img" aria-label="From the Vault back to Depositor, issuing 500,000,000 shares" style="stroke:#21E46B;stroke-width:1.75;stroke-linecap:round"/>
<line x1="452" y1="88" x2="452" y2="259" marker-end="url(#sav-arrow-dep)" role="img" aria-label="From Depositor to the Vault, redeeming 100,000,000 shares" style="stroke:#4C8DF6;stroke-width:1.75;stroke-linecap:round"/>
<line x1="616" y1="264" x2="616" y2="93" marker-end="url(#sav-arrow-vlt)" role="img" aria-label="From the Vault back to Depositor, transferring 100 XRP" style="stroke:#21E46B;stroke-width:1.75;stroke-linecap:round"/>
<rect x="48.5" y="139.5" width="151" height="71" rx="4" style="fill:#1E1E1E;stroke:#444444;stroke-width:1"/>
<text x="59" y="161" text-anchor="start" font-size="10.5" font-weight="700" style="fill:#6EA8FF" letter-spacing="0.5">DEPOSITOR SENDS</text>
<text x="59" y="181" text-anchor="start" font-size="13" font-weight="400" style="fill:#FFFFFF">Deposit <tspan font-weight="650">500 XRP</tspan></text>
<text x="59" y="199" text-anchor="start" font-size="12" font-weight="400" style="fill:#8A919A">500,000,000 drops</text>
<rect x="212.5" y="139.5" width="151" height="71" rx="4" style="fill:#1E1E1E;stroke:#444444;stroke-width:1"/>
<text x="223" y="161" text-anchor="start" font-size="10.5" font-weight="700" style="fill:#21E46B" letter-spacing="0.5">DEPOSITOR RECEIVES</text>
<text x="223" y="181" text-anchor="start" font-size="13" font-weight="400" style="fill:#FFFFFF">Issue</text>
<text x="223" y="199" text-anchor="start" font-size="13" font-weight="650" style="fill:#FFFFFF">500,000,000 shares</text>
<rect x="376.5" y="139.5" width="151" height="71" rx="4" style="fill:#1E1E1E;stroke:#444444;stroke-width:1"/>
<text x="387" y="161" text-anchor="start" font-size="10.5" font-weight="700" style="fill:#6EA8FF" letter-spacing="0.5">DEPOSITOR SENDS</text>
<text x="387" y="181" text-anchor="start" font-size="13" font-weight="400" style="fill:#FFFFFF">Redeem</text>
<text x="387" y="199" text-anchor="start" font-size="13" font-weight="650" style="fill:#FFFFFF">100,000,000 shares</text>
<rect x="540.5" y="139.5" width="151" height="71" rx="4" style="fill:#1E1E1E;stroke:#444444;stroke-width:1"/>
<text x="551" y="161" text-anchor="start" font-size="10.5" font-weight="700" style="fill:#21E46B" letter-spacing="0.5">DEPOSITOR RECEIVES</text>
<text x="551" y="181" text-anchor="start" font-size="13" font-weight="400" style="fill:#FFFFFF">Transfer <tspan font-weight="650">100 XRP</tspan></text>
<text x="551" y="199" text-anchor="start" font-size="12" font-weight="400" style="fill:#8A919A">100,000,000 drops</text>
<text x="136" y="116" text-anchor="start" font-size="11" font-weight="600" style="fill:#72777E" letter-spacing="0.66">1 · DEPOSIT</text>
<text x="464" y="116" text-anchor="start" font-size="11" font-weight="600" style="fill:#72777E" letter-spacing="0.66">2 · REDEEM</text>
<text x="380" y="475" text-anchor="middle" font-size="13" font-weight="400" style="fill:#72777E">Example with no yield or loss: 1 XRP = 1,000,000 drops, and 1 drop = 1 share</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
